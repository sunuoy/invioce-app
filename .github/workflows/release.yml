name: Auto Sync & Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p staging
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="latest"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "staging/InvoiceGenerator_${TAG_NAME}_debug.apk"

      - name: Upload APK to GitHub Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: invoice-generator-apk
          path: staging/*.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: staging/*.apk
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
